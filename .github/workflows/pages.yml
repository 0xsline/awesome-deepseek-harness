name: deploy-store

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'store/**'
      - 'CATALOG.md'
      - 'scripts/generate-store-catalog.py'
      - 'scripts/generate-catalog.py'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Regenerate store catalog (keeps Pages data fresh)
        run: |
          python3 scripts/generate-store-catalog.py CATALOG.md store/catalog.json

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: store

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
